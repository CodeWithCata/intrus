/* Paint the saved theme + accent on the very first frame. The app itself only starts once its scripts have loaded, so without this

/* The browser fires "beforeinstallprompt" very early, often before the app has started: keep the event so the install button (stores/install.svelte.ts) can still use it. */
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__bip=e});

#splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);background:var(--red,#D8002B);color:#fff;transition:opacity .3s ease}
html[data-theme=dark] #splash,html[data-theme=noir] #splash{background:#0F0F13}
#splash.out{opacity:0;pointer-events:none}
#splash .sl{position:relative;z-index:1;display:flex;font-family:AntonSplash,Anton,Impact,"Arial Narrow",sans-serif;font-size:clamp(56px,19vw,104px);line-height:1;letter-spacing:.02em}
#splash .sl i{display:inline-block;font-style:normal;clip-path:inset(0 0 100% 0)}
#splash .sl i:nth-child(even){clip-path:inset(100% 0 0 0)}
#splash .sl i.q{width:.32em;height:1em;margin-right:.03em}
#splash .sl i.q svg{display:block;width:100%;height:100%;overflow:visible}
#splash.go .sl i{animation:sp-down .18s cubic-bezier(.6,.05,.3,1) both;animation-delay:calc(var(--n) * 110ms)}
#splash.go .sl i:nth-child(even){animation-name:sp-up}
#splash .sb{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:3px;background:rgba(255,255,255,.18);opacity:0;transition:opacity .3s ease}
#splash.pre .sb{opacity:1}
#splash .sb i{display:block;height:100%;background:#fff;transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .25s ease}
#splash{--imp:#0F0F13}
html[data-theme=dark] #splash,html[data-theme=noir] #splash{--imp:var(--red,#D8002B)}
#splash.go .sl i:nth-child(5){animation-name:sp-down,sp-imp;animation-duration:.18s,.3s;animation-delay:440ms,800ms;animation-timing-function:cubic-bezier(.6,.05,.3,1),ease;animation-fill-mode:both,both}
@keyframes sp-imp{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1);color:var(--imp)}}
@keyframes sp-down{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes sp-up{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
@media (prefers-reduced-motion:reduce){#splash .sl i:nth-child(5){color:var(--imp)}#splash .sb{display:none}#splash,#splash *{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;clip-path:none!important}}
</style>
